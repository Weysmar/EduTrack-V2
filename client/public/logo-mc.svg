<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern vibrant blue gradient matching HubTrack theme -->
    <linearGradient id="brandGrad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Pixelated Minecraft Folder Outline (Strict 90-degree angles, 45° stepped slope) -->
  <path d="M60 60 H200 V92 H232 V124 H452 V452 H60 Z" 
        stroke="url(#brandGrad)" 
        stroke-width="40" 
        stroke-linecap="square" 
        stroke-linejoin="miter" 
        stroke-miterlimit="4" />
  
  <!-- Centered Pixelated Plus Sign (Strict 90-degree angles) -->
  <path d="M256 220 V372" 
        stroke="url(#brandGrad)" 
        stroke-width="40" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />
  <path d="M180 296 H332" 
        stroke="url(#brandGrad)" 
        stroke-width="40" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />
</svg>
