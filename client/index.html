<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HubTrack" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>HubTrack - Hub central pour votre vie</title>
  <meta name="description"
    content="HubTrack - Hub central pour gérer vos études (EduTrack) et vos finances (FinanceTrack) en un seul endroit." />

  <!-- Import Map for PDF.js Worker Resolution (fixes fake worker fallback on mobile) -->
  <script type="importmap">
    {
      "imports": {
        "pdf.worker.mjs": "/pdf.worker.min.mjs",
        "./pdf.worker.mjs": "/pdf.worker.min.mjs",
        "/pdf.worker.mjs": "/pdf.worker.min.mjs"
      }
    }
  </script>

  <!-- Inter and Caveat are self-hosted (src/index.css @font-face): preload the main weight -->
  <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Minecraftia font (low priority, async only) -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/minecraftia" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/minecraftia">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
